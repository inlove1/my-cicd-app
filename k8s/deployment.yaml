apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-cicd-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-cicd-app
  template:
    metadata:
      labels:
        app: my-cicd-app
    spec:
      containers:
      - name: my-cicd-app
        image: hesue/my-cicd-app:latest
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "v1.0"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"

